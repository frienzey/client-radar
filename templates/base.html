<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Radar {% block title %}{% endblock %}</title>
<style>
  :root { --bg:#0b0f17; --panel:#131a26; --line:#223047; --txt:#e8eef7; --mut:#8b98ad;
          --acc:#4f8cff; --hot:#ff5d5d; --warm:#ffb020; --ok:#34d399; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; }
  .wrap { max-width:980px; margin:0 auto; padding:24px 16px 64px; }
  header { display:flex; align-items:center; justify-content:space-between;
           padding:14px 0; border-bottom:1px solid var(--line); margin-bottom:24px; }
  .logo { font-weight:800; font-size:20px; letter-spacing:.5px; }
  .logo span { color:var(--acc); }
  nav a { color:var(--mut); text-decoration:none; margin-left:18px; font-size:14px; }
  nav a:hover, nav a.on { color:var(--txt); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px;
          padding:18px; margin-bottom:16px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .stat .n { font-size:30px; font-weight:800; }
  .stat .l { color:var(--mut); font-size:12px; text-transform:uppercase; letter-spacing:.6px; }
  .pill { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700; }
  .s-hot { background:rgba(255,93,93,.15); color:var(--hot); }
  .s-warm { background:rgba(255,176,32,.15); color:var(--warm); }
  .s-ok { background:rgba(52,211,153,.15); color:var(--ok); }
  .s-mut { background:rgba(139,152,173,.15); color:var(--mut); }
  .meta { color:var(--mut); font-size:13px; }
  a { color:var(--acc); }
  input[type=text], input[type=password], input[type=number], select {
    background:#0b0f17; border:1px solid var(--line); color:var(--txt);
    border-radius:10px; padding:10px 12px; font-size:14px; width:100%; }
  label { display:block; color:var(--mut); font-size:13px; margin:12px 0 6px; }
  .btn { background:var(--acc); color:#fff; border:0; border-radius:10px;
         padding:10px 18px; font-size:14px; font-weight:700; cursor:pointer; }
  .btn.ghost { background:transparent; border:1px solid var(--line); color:var(--txt); }
  .btn.danger { background:transparent; border:1px solid var(--hot); color:var(--hot); }
  .row { display:flex; gap:10px; align-items:center; }
  .err { background:rgba(255,93,93,.12); border:1px solid var(--hot); color:#ffb4b4;
         padding:10px 14px; border-radius:10px; margin-bottom:14px; }
  .okmsg { background:rgba(52,211,153,.12); border:1px solid var(--ok); color:#b8f4dd;
         padding:10px 14px; border-radius:10px; margin-bottom:14px; }
  .mention { border-bottom:1px solid var(--line); padding:14px 0; }
  .mention:last-child { border-bottom:0; }
  .draft { background:#0b0f17; border:1px dashed var(--line); border-radius:10px;
           padding:12px; margin-top:10px; font-size:14px; white-space:pre-wrap; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:700px){ .grid2{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">◉ Client <span>Radar</span></div>
  {% if show_nav|default(true) %}
  <nav>
    <a href="/" class="{{ 'on' if nav=='dash' }}">Dashboard</a>
    <a href="/mentions" class="{{ 'on' if nav=='mentions' }}">Mentions</a>
    <a href="/digest" class="{{ 'on' if nav=='digest' }}">Digest</a>
    <a href="/keywords" class="{{ 'on' if nav=='kw' }}">Keywords</a>
    <a href="/settings" class="{{ 'on' if nav=='set' }}">Settings</a>
  </nav>
  {% endif %}
</header>
{% block body %}{% endblock %}
</div>
</body>
</html>
